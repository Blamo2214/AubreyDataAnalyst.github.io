name: Update EIA Oil Inventories

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * 3"

permissions:
  contents: write

jobs:
  update-inventories:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and process EIA inventory data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["EIA_API_KEY"]

          BASE_URL = (
              "https://api.eia.gov/v2/"
              "petroleum/stoc/wstk/data/"
          )


          # -------------------------------------------------------
          # FETCH ONE WEEKLY EIA SERIES
          # -------------------------------------------------------

          def fetch_series(facets):

              params = {
                  "api_key": API_KEY,
                  "frequency": "weekly",
                  "data[0]": "value",
                  "sort[0][column]": "period",
                  "sort[0][direction]": "asc",
                  "offset": 0,
                  "length": 5000
              }

              for facet_name, facet_value in facets.items():

                  params[
                      f"facets[{facet_name}][]"
                  ] = facet_value

              url = (
                  BASE_URL +
                  "?" +
                  urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent":
                          "Agitlytics-Oil-Market-Monitor"
                  }
              )

              with urllib.request.urlopen(
                  request
              ) as response:

                  payload = json.load(response)

              return payload["response"]["data"]


          # -------------------------------------------------------
          # COMMERCIAL CRUDE EXCLUDING SPR
          # -------------------------------------------------------

          commercial_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPC0",
              "process": "SAX"
          })


          # -------------------------------------------------------
          # CUSHING
          # -------------------------------------------------------

          cushing_rows = fetch_series({
              "duoarea": "YCUOK",
              "product": "EPC0",
              "process": "SAX"
          })


          # -------------------------------------------------------
          # STRATEGIC PETROLEUM RESERVE
          # -------------------------------------------------------

          spr_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPC0",
              "process": "SAS"
          })


          # -------------------------------------------------------
          # TOTAL MOTOR GASOLINE
          # -------------------------------------------------------

          gasoline_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPM0",
              "process": "SAE"
          })


          # -------------------------------------------------------
          # DISTILLATE FUEL OIL
          # -------------------------------------------------------

          distillate_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPD0",
              "process": "SAE"
          })


          # -------------------------------------------------------
          # THOUSAND BARRELS -> MILLION BARRELS
          # -------------------------------------------------------

          def clean_series(rows):

              cleaned = []

              for row in rows:

                  value = row.get("value")

                  if value in (
                      None,
                      "",
                      "NA",
                      "W",
                      "--"
                  ):
                      continue

                  cleaned.append({
                      "date": row["period"],
                      "value": round(
                          float(value) / 1000,
                          3
                      )
                  })

              return cleaned


          commercial = clean_series(
              commercial_rows
          )

          cushing = clean_series(
              cushing_rows
          )

          spr = clean_series(
              spr_rows
          )

          gasoline = clean_series(
              gasoline_rows
          )

          distillates = clean_series(
              distillate_rows
          )


          # -------------------------------------------------------
          # LATEST REPORT DATE
          # -------------------------------------------------------

          all_dates = []

          for series in [
              commercial,
              cushing,
              spr,
              gasoline,
              distillates
          ]:

              if series:

                  all_dates.append(
                      series[-1]["date"]
                  )


          latest_date = (
              max(all_dates)
              if all_dates
              else None
          )


          # -------------------------------------------------------
          # BUILD OUTPUT
          # -------------------------------------------------------

          output = {

              "source":
                  "U.S. Energy Information Administration",

              "frequency":
                  "weekly",

              "unit":
                  "million barrels",

              "latest_date":
                  latest_date,

              "series": {


                  "commercial_crude": {

                      "name":
                          "U.S. Commercial Crude Oil",

                      "description":
                          "Ending Stocks Excluding SPR",

                      "data":
                          commercial
                  },


                  "cushing": {

                      "name":
                          "Cushing, Oklahoma Crude Oil",

                      "description":
                          "Commercial Crude Stocks",

                      "data":
                          cushing
                  },


                  "spr": {

                      "name":
                          "Strategic Petroleum Reserve",

                      "description":
                          "U.S. Crude Oil in SPR",

                      "data":
                          spr
                  },


                  "gasoline": {

                      "name":
                          "Total Motor Gasoline",

                      "description":
                          "U.S. Ending Stocks",

                      "data":
                          gasoline
                  },


                  "distillates": {

                      "name":
                          "Distillate Fuel Oil",

                      "description":
                          "U.S. Ending Stocks",

                      "data":
                          distillates
                  }

              }

          }


          # -------------------------------------------------------
          # SAVE JSON
          # -------------------------------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          output_path = (
              "data/eia-oil-inventories.json"
          )

          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2
              )


          # -------------------------------------------------------
          # SAFE DIAGNOSTICS
          # -------------------------------------------------------

          series_list = [
              (
                  "Commercial crude",
                  commercial
              ),
              (
                  "Cushing",
                  cushing
              ),
              (
                  "SPR",
                  spr
              ),
              (
                  "Gasoline",
                  gasoline
              ),
              (
                  "Distillates",
                  distillates
              )
          ]


          for name, series in series_list:

              print(
                  name,
                  "rows:",
                  len(series)
              )

              if series:

                  print(
                      name,
                      "latest:",
                      series[-1]
                  )


          print(
              "Latest report date:",
              latest_date
          )

          PY


      - name: Commit updated EIA inventory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/eia-oil-inventories.json

          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
          else
            git commit -m "Update EIA oil inventories"
            git push
          fi
