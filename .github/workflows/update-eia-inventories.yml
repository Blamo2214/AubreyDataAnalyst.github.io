name: Update EIA Oil Inventories

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * 3"

permissions:
  contents: write

jobs:
  update-inventories:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and process EIA inventory data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["EIA_API_KEY"]

          BASE_URL = (
              "https://api.eia.gov/v2/"
              "petroleum/stoc/wstk/data/"
          )

          # -------------------------------------------------------
          # Helper function
          # -------------------------------------------------------

          def fetch_series(facets):

              params = {
                  "api_key": API_KEY,
                  "frequency": "weekly",
                  "data[0]": "value",
                  "sort[0][column]": "period",
                  "sort[0][direction]": "asc",
                  "offset": 0,
                  "length": 5000
              }

              for facet_name, facet_value in facets.items():
                  params[
                      f"facets[{facet_name}][]"
                  ] = facet_value

              url = (
                  BASE_URL +
                  "?" +
                  urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent":
                          "Agitlytics-Oil-Market-Monitor"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)

              rows = payload["response"]["data"]

              return rows


          # -------------------------------------------------------
          # U.S. COMMERCIAL CRUDE EXCLUDING SPR
          # -------------------------------------------------------

          commercial_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPC0",
              "process": "SAX"
          })


          # -------------------------------------------------------
          # STRATEGIC PETROLEUM RESERVE
          # -------------------------------------------------------

          spr_rows = fetch_series({
              "duoarea": "NUS",
              "product": "EPC0",
              "process": "SAS"
          })


          # -------------------------------------------------------
          # CUSHING, OKLAHOMA
          # -------------------------------------------------------

          cushing_rows = fetch_series({
              "duoarea": "YCUOK",
              "product": "EPC0",
              "process": "SAX"
          })


          # -------------------------------------------------------
          # Convert EIA thousand barrels -> million barrels
          # -------------------------------------------------------

          def clean_series(rows):

              cleaned = []

              for row in rows:

                  value = row.get("value")

                  if value in (
                      None,
                      "",
                      "NA",
                      "W",
                      "--"
                  ):
                      continue

                  cleaned.append({
                      "date": row["period"],
                      "value": round(
                          float(value) / 1000,
                          3
                      )
                  })

              return cleaned


          commercial = clean_series(commercial_rows)
          cushing = clean_series(cushing_rows)
          spr = clean_series(spr_rows)


          # -------------------------------------------------------
          # Build output
          # -------------------------------------------------------

          all_dates = []

          for series in [
              commercial,
              cushing,
              spr
          ]:
              if series:
                  all_dates.append(
                      series[-1]["date"]
                  )

          latest_date = (
              max(all_dates)
              if all_dates
              else None
          )


          output = {

              "source": (
                  "U.S. Energy Information "
                  "Administration"
              ),

              "frequency": "weekly",

              "unit": "million barrels",

              "latest_date": latest_date,

              "series": {

                  "commercial_crude": {
                      "name":
                          "U.S. Commercial Crude Oil",
                      "description":
                          "Ending Stocks Excluding SPR",
                      "data": commercial
                  },

                  "cushing": {
                      "name":
                          "Cushing, Oklahoma Crude Oil",
                      "description":
                          "Commercial Crude Stocks",
                      "data": cushing
                  },

                  "spr": {
                      "name":
                          "Strategic Petroleum Reserve",
                      "description":
                          "U.S. Crude Oil in SPR",
                      "data": spr
                  }

              }

          }


          # -------------------------------------------------------
          # Save JSON
          # -------------------------------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          output_path = (
              "data/eia-oil-inventories.json"
          )

          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2
              )


          # -------------------------------------------------------
          # Print diagnostics
          # -------------------------------------------------------

          print(
              "Commercial crude rows:",
              len(commercial)
          )

          print(
              "Cushing rows:",
              len(cushing)
          )

          print(
              "SPR rows:",
              len(spr)
          )

          print(
              "Latest date:",
              latest_date
          )

          if commercial:
              print(
                  "Latest commercial crude:",
                  commercial[-1]
              )

          if cushing:
              print(
                  "Latest Cushing:",
                  cushing[-1]
              )

          if spr:
              print(
                  "Latest SPR:",
                  spr[-1]
              )

          PY


      - name: Commit updated EIA inventory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/eia-oil-inventories.json

          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
          else
            git commit -m "Update EIA oil inventories"
            git push
          fi
