name: Update EIA Oil Inventories

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-eia-inventories:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch EIA inventory data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["EIA_API_KEY"]

          base_url = "https://api.eia.gov/v2/petroleum/stoc/wstk/data/"

          params = {
              "api_key": api_key,
              "frequency": "weekly",
              "data[0]": "value",
              "sort[0][column]": "period",
              "sort[0][direction]": "desc",
              "offset": 0,
              "length": 20
          }

          url = base_url + "?" + urllib.parse.urlencode(params)

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "Agitlytics-Oil-Market-Monitor"
              }
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          os.makedirs("data", exist_ok=True)

          with open("data/eia-inventories-raw.json", "w") as f:
              json.dump(payload, f, indent=2)

          print(json.dumps(payload, indent=2))
          PY

      - name: Commit raw EIA response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/eia-inventories-raw.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fetch raw EIA inventory data"
            git push
          fi
