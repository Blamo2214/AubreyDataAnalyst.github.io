name: Update JODI Global Oil Data

on:
  workflow_dispatch:

  schedule:
    # JODI normally updates around the 20th of each month.
    - cron: "45 15 21 * *"


permissions:
  contents: write


jobs:

  update-jodi-data:

    runs-on: ubuntu-latest


    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pycountry


      - name: Download and process JODI data
        run: |
          python <<'PY'

          import json
          import shutil
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd
          import pycountry
          import requests


          # =========================================================
          # CONFIGURATION
          # =========================================================

          START_YEAR = 2002

          CURRENT_YEAR = datetime.now(
              timezone.utc
          ).year


          OUTPUT_DIR = Path(
              "data/jodi"
          )

          COUNTRY_DIR = (
              OUTPUT_DIR /
              "countries"
          )

          SUMMARY_FILE = (
              OUTPUT_DIR /
              "summary.json"
          )


          BASE_DIR = (
              "https://www.jodidata.org/"
              "_resources/files/downloads/"
              "oil-data/annual-csv/primary/"
          )


          FLOW_CONFIG = {

              "INDPROD": {
                  "key":
                      "crude_production",

                  "name":
                      "Crude Oil Production",

                  "source_unit":
                      "KBD",

                  "unit":
                      "million barrels per day"
              },

              "TOTIMPSB": {
                  "key":
                      "crude_imports",

                  "name":
                      "Crude Oil Imports",

                  "source_unit":
                      "KBD",

                  "unit":
                      "million barrels per day"
              },

              "TOTEXPSB": {
                  "key":
                      "crude_exports",

                  "name":
                      "Crude Oil Exports",

                  "source_unit":
                      "KBD",

                  "unit":
                      "million barrels per day"
              },

              "REFINOBS": {
                  "key":
                      "refinery_intake",

                  "name":
                      "Refinery Crude Intake",

                  "source_unit":
                      "KBD",

                  "unit":
                      "million barrels per day"
              },

              "CLOSTLV": {
                  "key":
                      "closing_stocks",

                  "name":
                      "Closing Crude Oil Stocks",

                  "source_unit":
                      "KBBL",

                  "unit":
                      "million barrels"
              }

          }


          # =========================================================
          # COUNTRY NAME HELPER
          # =========================================================

          COUNTRY_OVERRIDES = {

              "AE":
                  "United Arab Emirates",

              "BO":
                  "Bolivia",

              "BN":
                  "Brunei",

              "CD":
                  "Democratic Republic of the Congo",

              "CI":
                  "Ivory Coast",

              "CZ":
                  "Czech Republic",

              "GB":
                  "United Kingdom",

              "IR":
                  "Iran",

              "KR":
                  "South Korea",

              "KP":
                  "North Korea",

              "LA":
                  "Laos",

              "MD":
                  "Moldova",

              "PS":
                  "Palestine",

              "RU":
                  "Russia",

              "SY":
                  "Syria",

              "TR":
                  "Turkey",

              "TZ":
                  "Tanzania",

              "US":
                  "United States",

              "VE":
                  "Venezuela",

              "VN":
                  "Vietnam"

          }


          def country_name(code):

              if code in COUNTRY_OVERRIDES:
                  return COUNTRY_OVERRIDES[
                      code
                  ]

              try:

                  country = (
                      pycountry.countries.get(
                          alpha_2=code
                      )
                  )

                  if country:
                      return country.name

              except Exception:
                  pass

              return code


          # =========================================================
          # DOWNLOAD HELPER
          # =========================================================

          def download_year(year):

              urls = [

                  (
                      BASE_DIR +
                      f"primaryyear{year}.csv"
                  ),

                  (
                      BASE_DIR +
                      f"{year}.csv"
                  )

              ]


              print()
              print(
                  f"Downloading JODI {year}..."
              )


              last_error = None


              for url in urls:

                  for attempt in range(
                      1,
                      4
                  ):

                      try:

                          print(
                              f"Trying {url}"
                          )


                          response = (
                              requests.get(
                                  url,
                                  timeout=90
                              )
                          )


                          response.raise_for_status()


                          beginning = (
                              response.text[
                                  :200
                              ]
                              .lower()
                          )


                          if (
                              "<html"
                              in beginning
                              or
                              "<!doctype html"
                              in beginning
                          ):

                              raise RuntimeError(
                                  "JODI returned "
                                  "HTML instead "
                                  "of CSV."
                              )


                          print(
                              f"Downloaded "
                              f"{year}: "
                              f"{len(response.content):,} "
                              f"bytes"
                          )


                          return (
                              response.content
                          )


                      except Exception as error:

                          last_error = error


                          print(
                              f"Attempt "
                              f"{attempt} "
                              f"failed: "
                              f"{error}"
                          )


                          if attempt < 3:

                              time.sleep(
                                  attempt * 2
                              )


              raise RuntimeError(
                  f"Could not download "
                  f"JODI data for "
                  f"{year}: "
                  f"{last_error}"
              )


          # =========================================================
          # PREPARE DIRECTORIES
          # =========================================================

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # Remove old per-country files so countries that
          # disappear from a later JODI release do not remain
          # on the website indefinitely.

          if COUNTRY_DIR.exists():

              shutil.rmtree(
                  COUNTRY_DIR
              )


          COUNTRY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          TEMP_DIR = Path(
              "data/jodi-temp"
          )


          if TEMP_DIR.exists():

              shutil.rmtree(
                  TEMP_DIR
              )


          TEMP_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # =========================================================
          # DOWNLOAD ALL YEARS
          # =========================================================

          frames = []


          for year in range(
              START_YEAR,
              CURRENT_YEAR + 1
          ):

              content = download_year(
                  year
              )


              temp_file = (
                  TEMP_DIR /
                  f"{year}.csv"
              )


              temp_file.write_bytes(
                  content
              )


              frame = pd.read_csv(
                  temp_file,
                  dtype=str
              )


              frames.append(
                  frame
              )


          # =========================================================
          # COMBINE DATA
          # =========================================================

          print()
          print(
              "Combining JODI files..."
          )


          df = pd.concat(
              frames,
              ignore_index=True
          )


          print(
              f"Raw rows: "
              f"{len(df):,}"
          )


          # =========================================================
          # VALIDATE SCHEMA
          # =========================================================

          REQUIRED_COLUMNS = {

              "REF_AREA",
              "TIME_PERIOD",
              "ENERGY_PRODUCT",
              "FLOW_BREAKDOWN",
              "UNIT_MEASURE",
              "OBS_VALUE",
              "ASSESSMENT_CODE"

          }


          missing_columns = (
              REQUIRED_COLUMNS -
              set(df.columns)
          )


          if missing_columns:

              raise RuntimeError(
                  "Missing JODI columns: "
                  f"{sorted(missing_columns)}"
              )


          # =========================================================
          # FILTER CRUDE OIL
          # =========================================================

          df = df[
              df["ENERGY_PRODUCT"]
              == "CRUDEOIL"
          ].copy()


          df = df[
              df["FLOW_BREAKDOWN"]
              .isin(
                  FLOW_CONFIG.keys()
              )
          ].copy()


          # =========================================================
          # SELECT CORRECT SOURCE UNIT
          # =========================================================

          def valid_unit(row):

              flow = (
                  row[
                      "FLOW_BREAKDOWN"
                  ]
              )


              expected = (
                  FLOW_CONFIG[
                      flow
                  ][
                      "source_unit"
                  ]
              )


              return (
                  row[
                      "UNIT_MEASURE"
                  ]
                  == expected
              )


          df = df[
              df.apply(
                  valid_unit,
                  axis=1
              )
          ].copy()


          # =========================================================
          # CLEAN VALUES
          # =========================================================

          df["VALUE_RAW"] = (
              pd.to_numeric(
                  df["OBS_VALUE"],
                  errors="coerce"
              )
          )


          invalid_values = int(
              df["VALUE_RAW"]
              .isna()
              .sum()
          )


          print(
              f"Non-numeric values "
              f"removed: "
              f"{invalid_values:,}"
          )


          df = df.dropna(
              subset=[
                  "VALUE_RAW"
              ]
          ).copy()


          # KBD  -> million barrels/day
          # KBBL -> million barrels

          df["VALUE"] = (
              df["VALUE_RAW"]
              / 1000.0
          )


          # =========================================================
          # CLEAN DATES
          # =========================================================

          df["DATE"] = (
              pd.to_datetime(
                  df["TIME_PERIOD"],
                  format="%Y-%m",
                  errors="coerce"
              )
          )


          df = df.dropna(
              subset=[
                  "DATE"
              ]
          ).copy()


          # =========================================================
          # REMOVE DUPLICATES
          # =========================================================

          df = df.sort_values(

              [
                  "REF_AREA",
                  "FLOW_BREAKDOWN",
                  "DATE"
              ]

          )


          before = len(df)


          df = df.drop_duplicates(

              subset=[
                  "REF_AREA",
                  "FLOW_BREAKDOWN",
                  "TIME_PERIOD"
              ],

              keep="last"

          )


          print(
              "Duplicate rows removed:",
              before - len(df)
          )


          # =========================================================
          # GLOBAL METADATA
          # =========================================================

          generated_at = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )


          latest_global_month = (
              df["TIME_PERIOD"]
              .max()
          )


          country_codes = sorted(
              df["REF_AREA"]
              .dropna()
              .unique()
          )


          print()
          print(
              f"Countries/areas: "
              f"{len(country_codes)}"
          )

          print(
              f"Latest global month: "
              f"{latest_global_month}"
          )


          # =========================================================
          # BUILD COUNTRY FILES
          # =========================================================

          summary_countries = []

          total_observations = 0


          for code in country_codes:

              country_df = df[
                  df["REF_AREA"]
                  == code
              ].copy()


              name = country_name(
                  code
              )


              country_output = {

                  "source":
                      "JODI Oil World Database",

                  "dataset":
                      "Extended Primary",

                  "generated_at":
                      generated_at,

                  "country": {
                      "code":
                          code,

                      "name":
                          name
                  },

                  "series": {}

              }


              summary_entry = {

                  "code":
                      code,

                  "name":
                      name,

                  "file":
                      f"countries/{code}.json",

                  "series": {}

              }


              for (
                  flow_code,
                  config
              ) in FLOW_CONFIG.items():

                  series_df = (
                      country_df[
                          country_df[
                              "FLOW_BREAKDOWN"
                          ]
                          == flow_code
                      ]
                      .sort_values(
                          "DATE"
                      )
                  )


                  observations = []


                  for _, row in (
                      series_df.iterrows()
                  ):

                      assessment = (
                          row[
                              "ASSESSMENT_CODE"
                          ]
                      )


                      if (
                          pd.isna(
                              assessment
                          )
                      ):

                          assessment = None

                      else:

                          assessment = (
                              str(
                                  assessment
                              )
                          )


                      observations.append({

                          "date":
                              row[
                                  "TIME_PERIOD"
                              ],

                          "value":
                              round(
                                  float(
                                      row[
                                          "VALUE"
                                      ]
                                  ),
                                  4
                              ),

                          "assessment_code":
                              assessment

                      })


                  if not observations:

                      continue


                  total_observations += (
                      len(
                          observations
                      )
                  )


                  latest_observation = (
                      observations[-1]
                  )


                  country_output[
                      "series"
                  ][
                      config["key"]
                  ] = {

                      "name":
                          config[
                              "name"
                          ],

                      "flow_code":
                          flow_code,

                      "unit":
                          config[
                              "unit"
                          ],

                      "latest_reported_month":
                          latest_observation[
                              "date"
                          ],

                      "latest_value":
                          latest_observation[
                              "value"
                          ],

                      "observations":
                          observations

                  }


                  summary_entry[
                      "series"
                  ][
                      config["key"]
                  ] = {

                      "name":
                          config[
                              "name"
                          ],

                      "unit":
                          config[
                              "unit"
                          ],

                      "latest_reported_month":
                          latest_observation[
                              "date"
                          ],

                      "latest_value":
                          latest_observation[
                              "value"
                          ],

                      "observation_count":
                          len(
                              observations
                          )

                  }


              country_file = (
                  COUNTRY_DIR /
                  f"{code}.json"
              )


              with country_file.open(
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      country_output,
                      file,
                      indent=2
                  )

                  file.write(
                      "\n"
                  )


              summary_countries.append(
                  summary_entry
              )


          # =========================================================
          # BUILD SMALL SUMMARY / INDEX FILE
          # =========================================================

          summary = {

              "source":
                  "JODI Oil World Database",

              "dataset":
                  "Extended Primary",

              "generated_at":
                  generated_at,

              "start_year":
                  START_YEAR,

              "end_year":
                  CURRENT_YEAR,

              "latest_global_reported_month":
                  latest_global_month,

              "country_area_count":
                  len(
                      summary_countries
                  ),

              "observation_count":
                  total_observations,

              "flows": {

                  config["key"]: {

                      "name":
                          config[
                              "name"
                          ],

                      "flow_code":
                          flow_code,

                      "unit":
                          config[
                              "unit"
                          ]

                  }

                  for (
                      flow_code,
                      config
                  )
                  in FLOW_CONFIG.items()

              },

              "countries":
                  summary_countries

          }


          with SUMMARY_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  summary,
                  file,
                  indent=2
              )

              file.write(
                  "\n"
              )


          # =========================================================
          # REMOVE OLD MONOLITHIC FILES
          # =========================================================

          old_files = [

              Path(
                  "data/jodi-global-oil.json"
              ),

              Path(
                  "data/jodi-primary-raw.csv"
              ),

              Path(
                  "data/jodi-primary-summary.json"
              )

          ]


          for old_file in old_files:

              if old_file.exists():

                  print(
                      f"Removing old file: "
                      f"{old_file}"
                  )

                  old_file.unlink()


          # =========================================================
          # CLEAN TEMP DIRECTORY
          # =========================================================

          shutil.rmtree(
              TEMP_DIR,
              ignore_errors=True
          )


          # =========================================================
          # FINAL OUTPUT
          # =========================================================

          print()
          print(
              "JODI processing complete."
          )

          print(
              f"Country files created: "
              f"{len(summary_countries)}"
          )

          print(
              f"Total observations: "
              f"{total_observations:,}"
          )

          print(
              f"Summary file: "
              f"{SUMMARY_FILE}"
          )

          print(
              f"Country directory: "
              f"{COUNTRY_DIR}"
          )

          PY


      - name: Validate generated JODI files
        run: |
          python <<'PY'

          import json
          from pathlib import Path


          summary_file = Path(
              "data/jodi/summary.json"
          )


          country_dir = Path(
              "data/jodi/countries"
          )


          if not summary_file.exists():

              raise SystemExit(
                  "JODI summary file "
                  "was not created."
              )


          with summary_file.open(
              "r",
              encoding="utf-8"
          ) as file:

              summary = json.load(
                  file
              )


          countries = (
              summary.get(
                  "countries",
                  []
              )
          )


          if not countries:

              raise SystemExit(
                  "JODI summary "
                  "contains no countries."
              )


          country_files = list(
              country_dir.glob(
                  "*.json"
              )
          )


          if len(country_files) != len(
              countries
          ):

              raise SystemExit(
                  "Country-file count "
                  "does not match "
                  "summary count."
              )


          observations = (
              summary.get(
                  "observation_count",
                  0
              )
          )


          if observations <= 0:

              raise SystemExit(
                  "No JODI observations "
                  "were generated."
              )


          print(
              "JODI validation passed."
          )

          print(
              "Countries/areas:",
              len(countries)
          )

          print(
              "Country files:",
              len(country_files)
          )

          print(
              "Observations:",
              observations
          )

          print(
              "Latest global month:",
              summary.get(
                  "latest_global_reported_month"
              )
          )

          PY


      - name: Commit updated JODI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/jodi
          git add -u data

          if git diff --cached --quiet; then
            echo "No JODI changes to commit."
            exit 0
          fi

          git commit -m "Update JODI global oil data"

          for attempt in 1 2 3; do

            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin main; then
              echo "JODI data successfully updated."
              exit 0
            fi

            echo "Remote changed during push. Retrying..."
            sleep 5

          done

          echo "Failed to push JODI update after 3 attempts."
          exit 1
