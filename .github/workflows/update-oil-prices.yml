name: Update Oil Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"


permissions:
  contents: write


jobs:

  update-prices:

    runs-on: ubuntu-latest


    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: Fetch and process oil prices
        env:
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}

        run: |
          python <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests


          API_KEY = os.environ["OILPRICE_API_KEY"]

          API_URL = (
              "https://api.oilpriceapi.com/v1/prices/latest"
          )

          OUTPUT_FILE = Path(
              "data/oil-market-prices.json"
          )


          COMMODITIES = [
              "WTI_USD",
              "BRENT_CRUDE_USD",
              "GASOLINE_USD",
          ]


          def fetch_price(code):

              headers = {
                  "Authorization":
                      f"Token {API_KEY}"
              }

              params = {
                  "by_code": code
              }


              last_error = None


              for attempt in range(1, 4):

                  try:

                      print(
                          f"Fetching {code} "
                          f"(attempt {attempt})..."
                      )

                      response = requests.get(
                          API_URL,
                          headers=headers,
                          params=params,
                          timeout=20
                      )

                      response.raise_for_status()

                      payload = response.json()


                      if (
                          payload.get("status")
                          != "success"
                      ):
                          raise RuntimeError(
                              f"OilPriceAPI returned "
                              f"non-success status "
                              f"for {code}: {payload}"
                          )


                      data = payload.get("data")


                      if not isinstance(
                          data,
                          dict
                      ):
                          raise RuntimeError(
                              f"Missing data object "
                              f"for {code}"
                          )


                      if (
                          data.get("code")
                          != code
                      ):
                          raise RuntimeError(
                              f"Expected {code}, "
                              f"received "
                              f"{data.get('code')}"
                          )


                      if (
                          data.get("price")
                          is None
                      ):
                          raise RuntimeError(
                              f"Price missing for "
                              f"{code}"
                          )


                      print(
                          f"{code}: "
                          f"{data.get('price')}"
                      )

                      return data


                  except Exception as error:

                      last_error = error

                      print(
                          f"Attempt {attempt} "
                          f"failed for {code}: "
                          f"{error}"
                      )

                      if attempt < 3:
                          time.sleep(
                              3 * attempt
                          )


              raise RuntimeError(
                  f"Failed to fetch {code} "
                  f"after 3 attempts: "
                  f"{last_error}"
              )


          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          existing_data = {}

          if OUTPUT_FILE.exists():

              try:

                  with OUTPUT_FILE.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      existing_data = (
                          json.load(file)
                      )

              except Exception as error:

                  print(
                      "Could not read existing "
                      "price JSON:",
                      error
                  )


          output = {}


          for code in COMMODITIES:

              data = fetch_price(code)


              price = float(
                  data["price"]
              )


              existing_price = (
                  existing_data
                  .get(code, {})
                  .get("price")
              )


              change = 0.0
              change_percent = 0.0


              if existing_price is not None:

                  try:

                      old_price = float(
                          existing_price
                      )

                      change = (
                          price -
                          old_price
                      )

                      if old_price != 0:

                          change_percent = (
                              change /
                              old_price
                          ) * 100

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass


              output[code] = {

                  "price":
                      price,

                  "change":
                      round(
                          change,
                          4
                      ),

                  "change_percent":
                      round(
                          change_percent,
                          4
                      ),

                  "timestamp":
                      (
                          data.get("as_of")
                          or
                          data.get(
                              "created_at"
                          )
                          or
                          data.get(
                              "collected_at"
                          )
                      ),

                  "currency":
                      data.get("currency"),

                  "type":
                      data.get("type"),

                  "source":
                      data.get("source"),

                  "stale":
                      data.get("stale"),

                  "synthetic":
                      data.get(
                          "synthetic"
                      ),

                  "data_status":
                      data.get(
                          "data_status"
                      ),

                  "metadata":
                      data.get(
                          "metadata"
                      )

              }


          with OUTPUT_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )

              file.write("\n")


          print(
              f"Updated {OUTPUT_FILE}"
          )

          PY


      - name: Commit updated oil prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oil-market-prices.json

          if git diff --cached --quiet; then
            echo "No oil price changes to commit."
            exit 0
          fi

          git commit -m "Update oil market prices"

          for attempt in 1 2 3; do

            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin main; then
              echo "Oil prices successfully updated."
              exit 0
            fi

            echo "Remote changed during push. Retrying..."
            sleep 5

          done

          echo "Failed to push oil price update after 3 attempts."
          exit 1
