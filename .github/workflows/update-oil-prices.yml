      - name: Commit updated oil prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oil-market-prices.json

          if git diff --cached --quiet; then
            echo "No oil price changes to commit."
            exit 0
          fi

          git commit -m "Update oil market prices"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin main; then
              echo "Oil prices successfully updated."
              exit 0
            fi

            echo "Remote changed during push. Retrying..."
            sleep 5
          done

          echo "Failed to push oil price update after 3 attempts."
          exit 1
