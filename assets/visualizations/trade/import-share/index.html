<head>
    <meta charset="UTF-8">

    <title>Import Share: China vs. United States</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .visualization-layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            min-height: 100vh;
        }

        .country-panel {
            padding: 20px;
            border-right: 1px solid #444444;
            background: #181818;
            overflow-y: auto;
        }

        .country-panel h2 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        .metric-description {
            margin: 0 0 16px;
            color: #c4c4c4;
            font-size: 13px;
            line-height: 1.45;
        }

        .country-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .country-actions button,
        .continent-actions button {
            padding: 6px 9px;
            border: 1px solid #666666;
            border-radius: 5px;
            background: #2b2b2b;
            color: #ffffff;
            cursor: pointer;
        }

        .country-actions button:hover,
        .continent-actions button:hover {
            background: #3b3b3b;
        }

        .continent-group {
            padding: 12px 0;
            border-top: 1px solid #343434;
        }

        .continent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 9px;
        }

        .continent-header h3 {
            margin: 0;
            font-size: 15px;
        }

        .continent-actions {
            display: flex;
            gap: 5px;
        }

        .continent-actions button {
            padding: 3px 6px;
            font-size: 11px;
        }

        .continent-countries {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .country-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .color-key {
            display: grid;
            gap: 7px;
            padding: 12px 0 16px;
            border-top: 1px solid #343434;
        }

        .color-key-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d7d7d7;
            font-size: 12px;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        .chart-container {
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        #year-watermark {
            position: absolute;
            top: 55px;
            right: 70px;

            z-index: 2;

            font-size: 190px;
            font-weight: 500;
            line-height: 1;

            color: rgba(255, 255, 255, 0.08);

            pointer-events: none;
            user-select: none;
        }

        #trade-chart {
            width: 100%;
        }

        @media (max-width: 800px) {
            .visualization-layout {
                grid-template-columns: 1fr;
            }

            .country-panel {
                border-right: 0;
                border-bottom: 1px solid #444444;
                max-height: 420px;
            }

            .continent-countries {
                display: grid;
                grid-template-columns:
                    repeat(auto-fit, minmax(130px, 1fr));
            }
        }
    </style>
</head>

        const axisPadding = 1.1;

        const chart = document.getElementById(chartId);
        const yearWatermark = document.getElementById("year-watermark");

        function updateYearWatermark(year) {
            yearWatermark.textContent = String(year);
        }

        chart.on("plotly_sliderchange", (event) => {
            if (event.step && event.step.label) {
                updateYearWatermark(event.step.label);
            }
        });

        chart.on("plotly_animatingframe", (event) => {
            if (event && event.name) {
                updateYearWatermark(event.name);
            }
        });

        const checkboxes = document.querySelectorAll(
            ".country-checkbox"
        );

        function setTraceVisibility(traceIndex, isVisible) {
            Plotly.restyle(
                chartId,
                { visible: isVisible },
                [traceIndex]
            );
        }

        function getSelectedCountries() {
            return Array.from(checkboxes)
                .filter((checkbox) => checkbox.checked)
                .map((checkbox) => {
                    const traceIndex = Number(
                        checkbox.dataset.traceIndex
                    );
                    return countries[traceIndex];
                });
        }

        function updateAxisRanges() {
            const selectedCountries = getSelectedCountries();

            if (selectedCountries.length === 0) {
                return;
            }

            const xMax = Math.max(
                ...selectedCountries.map(
                    (country) => countryRanges[country].x_max
                )
            );

            const yMax = Math.max(
                ...selectedCountries.map(
                    (country) => countryRanges[country].y_max
                )
            );

            const paddedXMax = xMax * axisPadding;
            const paddedYMax = yMax * axisPadding;

            const equalityMax = Math.min(
                paddedXMax,
                paddedYMax
            );

            Plotly.relayout(
                chartId,
                {
                    "xaxis.autorange": false,
                    "yaxis.autorange": false,

                    "xaxis.range": [0, paddedXMax],
                    "yaxis.range": [0, paddedYMax],

                    "shapes[0].x0": 0,
                    "shapes[0].y0": 0,
                    "shapes[0].x1": equalityMax,
                    "shapes[0].y1": equalityMax
                }
            );
        }

        function setCheckboxes(checkboxSet, isChecked) {
            checkboxSet.forEach((checkbox) => {
                checkbox.checked = isChecked;
                setTraceVisibility(
                    Number(checkbox.dataset.traceIndex),
                    isChecked
                );
            });

            if (isChecked) {
                updateAxisRanges();
            } else if (getSelectedCountries().length > 0) {
                updateAxisRanges();
            }
        }

        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener("change", () => {
                setTraceVisibility(
                    Number(checkbox.dataset.traceIndex),
                    checkbox.checked
                );
                updateAxisRanges();
            });
        });

        document
            .getElementById("select-all")
            .addEventListener("click", () => {
                setCheckboxes(Array.from(checkboxes), true);
            });

        document
            .getElementById("clear-all")
            .addEventListener("click", () => {
                setCheckboxes(Array.from(checkboxes), false);
            });

        document
            .querySelectorAll(".continent-select")
            .forEach((button) => {
                button.addEventListener("click", () => {
                    const continentId = button.dataset.continentId;
                    const groupCheckboxes = Array.from(
                        document.querySelectorAll(
                            `.country-checkbox[data-continent-id="${continentId}"]`
                        )
                    );
                    setCheckboxes(groupCheckboxes, true);
                });
            });

        document
            .querySelectorAll(".continent-clear")
            .forEach((button) => {
                button.addEventListener("click", () => {
                    const continentId = button.dataset.continentId;
                    const groupCheckboxes = Array.from(
                        document.querySelectorAll(
                            `.country-checkbox[data-continent-id="${continentId}"]`
                        )
                    );
                    setCheckboxes(groupCheckboxes, false);
                });
            });
